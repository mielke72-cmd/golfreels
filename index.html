<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel Training Library</title>
<style>
:root{--bg:#0e1210;--card:#171d1a;--card2:#1e2622;--line:#2a3430;--tx:#e8efe9;--mut:#93a39a;--acc:#5fd08a;--acc2:#e9c46a;--red:#e76f51;--blue:#6aa9e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,18,16,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px 8px}
h1{font-size:19px;margin:0 0 2px}.sub{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:#08130c;border-color:var(--acc);font-weight:600}
.chip.f{border-color:#3d4a2c}.chip.f.on{background:var(--acc2);border-color:var(--acc2)}
.chip.c{border-color:#2c3e4f}.chip.c.on{background:var(--blue);border-color:var(--blue);color:#06101c}
.tag.club{background:#1f2c3c;color:#a9cdf4}
.chip small{opacity:.7;margin-left:4px}
input[type=search]{width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
main{padding:12px 14px 60px;max-width:760px;margin:0 auto}
.intro{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;color:#cfdad3}
.intro b{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.st-ignore{opacity:.5}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.own{font-weight:600;font-size:14px}.sec{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.cap{margin:6px 0;color:#d5ded8;font-size:14px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.cap.open{-webkit-line-clamp:unset;display:block}.cap.empty{color:var(--mut);font-style:italic}
.note{font-size:13px;background:#232b1c;border-left:3px solid var(--acc2);padding:6px 9px;border-radius:6px;margin:6px 0;color:#e9e2c4}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{font-size:11.5px;padding:2px 7px;border-radius:6px;background:#22302a;color:#a9e6bf}
.tag.fixed{background:#3a2420;color:#f4b6a6}.tag.ryan{background:#1f2c3c;color:#a9cdf4}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
a.open{background:var(--acc);color:#08130c;text-decoration:none;font-weight:600;padding:7px 12px;border-radius:8px;font-size:13.5px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{background:none;border:0;color:var(--mut);padding:6px 8px;font-size:12.5px;cursor:pointer}
.seg button.on[data-s=try]{background:var(--blue);color:#06101c}.seg button.on[data-s=keep]{background:var(--acc);color:#08130c}.seg button.on[data-s=ignore]{background:var(--red);color:#1c0905}
textarea{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px;font:13.5px inherit;resize:vertical;min-height:34px}
iframe{width:100%;height:620px;border:0;border-radius:10px;margin-top:8px;background:#000}
.empty-state{color:var(--mut);text-align:center;padding:40px 0}
.stats{display:flex;gap:10px;font-size:12px;color:var(--mut);margin-top:6px}
</style></head><body>
<header>
 <h1>⛳ Reel Training Library</h1>
 <div class="sub" id="sub"></div>
 <div class="row" id="focus"></div>
 <div class="row" id="secs"></div>
 <div class="row" id="clubs"></div>
 <div class="row" id="stat"></div>
 <input type="search" id="q" placeholder="Search captions or creators…">
</header>
<main><div id="intro"></div><div id="list"></div></main>
<script>
const REELS=[{"id": "DesW1SXiWsl", "url": "https://www.instagram.com/reel/DesW1SXiWsl/", "owner": "jerome.rufin", "cap": "The Simplest Key to Hit Your Irons Straighter & Farther", "sec": "strike", "tags": ["flip"], "note": "", "ts": 1794888215, "club": ["irons"]}, {"id": "DfzYrtSjcMx", "url": "https://www.instagram.com/reel/DfzYrtSjcMx/", "owner": "swingdecoded", "cap": "If you hit your irons fat one swing and thin the next, that's not two problems. It's one mistake.\n\nWith an iron, the bottom of your swing should come after the ball. When it comes behind it: a little low, fat. A little high, thin. Standing taller or dipping down only swaps one for the other, because the miss is front to back.\n\nThe fix: from the top, a small bump toward your front foot, then the arms. Hands ahead at impact. The drill: push a tee into the ground just in front of the ball. Hit the ball, then the tee.\n\nFat or thin: which one is yours? Tell me below.\n\nWant to work on your swing at home? Link in bio.\n\n#golf #golfswing #golftips #ironplay #golfdrills", "sec": "fat", "tags": [], "note": "The core idea of this section: fat and thin are one fault — low point behind the ball.", "ts": 1794886691, "club": ["irons"]}, {"id": "DekKz07Nkwa", "url": "https://www.instagram.com/reel/DekKz07Nkwa/", "owner": "michaelfarriertwist", "cap": "What do you notice about Adam Scott’s driver swing? ⛳️ #golf #golfswing #adamscott", "sec": "driver", "tags": [], "note": "", "ts": 1794246571, "club": ["driver"]}, {"id": "DejzFX9uu_j", "url": "https://www.instagram.com/reel/DejzFX9uu_j/", "owner": "jackaffleck_", "cap": "Send this to a mate who needs to hear this swing advice 🤝", "sec": "misc", "tags": [], "note": "", "ts": 1794200338, "club": []}, {"id": "DfQBWHSBNi_", "url": "https://www.instagram.com/reel/DfQBWHSBNi_/", "owner": "nate.crawford.golf", "cap": "Get rid of the chunks for good…same thought for every club in the bag…follow for more…drop a comment on what you guys are struggling with in your golf game right now⬇️⬇️\n\n#golfinstruction #golfaddict #golfswing #ironswing #golf", "sec": "fat", "tags": [], "note": "", "ts": 1793687651, "club": ["irons"]}, {"id": "Dd4TM-FOXTf", "url": "https://www.instagram.com/reel/Dd4TM-FOXTf/", "owner": "adamlynn_pga", "cap": "4 lies, 4 simple adjustments ⛳️\n\nCheck if you do these thigs 👏🏽\n\nFollow for more 📲\n\n#golftips", "sec": "shots", "tags": [], "note": "", "ts": 1793521984, "club": []}, {"id": "DeamfgHDh6Y", "url": "https://www.instagram.com/reel/DeamfgHDh6Y/", "owner": "jerome.rufin", "cap": "This World #1 Golf Coach Shows me the 4 Keys to Finally Fix Your Bunker Shots", "sec": "short", "tags": [], "note": "", "ts": 1791862657, "club": []}, {"id": "DeadqEZRzp4", "url": "https://www.instagram.com/reel/DeadqEZRzp4/", "owner": "markspitzergolf", "cap": "This drill fixes a lot of things at once.\n\nPulled from a real online lesson. It’s simple, it works, and most golfers are shocked at how fast it clicks.\n\nSave this for your next range session.\n\nWhat’s the one part of your swing you’d fix first?\n\nFollow @markspitzergolf for daily swing fixes.", "sec": "misc", "tags": [], "note": "", "ts": 1791861121, "club": []}, {"id": "Dd8_mx0g2gd", "url": "https://www.instagram.com/reel/Dd8_mx0g2gd/", "owner": "michaelalexandergolf", "cap": "Most people will ignore their grip and believe it has nothing to do with their swing issues! They are foolish... do the basics right first then yiu can focus on the rest! \n.\n.\n#golf #golfswing #golftips #golfgrip #golfdrills", "sec": "setup", "tags": [], "note": "", "ts": 1790913605, "club": []}, {"id": "DbToup3OI0t", "url": "https://www.instagram.com/reel/DbToup3OI0t/", "owner": "theputtingdr", "cap": "Only right for the putting doctor to actual teach some putting! \n\nWelcome to putting basics, where I’ll be giving you 45 years or putting lessons to help you get the ball in the hole more often! \n\nStarting off with other the basics, save this for your next round 👇\n\n#golf #golfcoach #golftips #shortgame #putting", "sec": "putt", "tags": [], "note": "", "ts": 1790392745, "club": []}, {"id": "Dc1XDyJEVAl", "url": "https://www.instagram.com/p/Dc1XDyJEVAl/", "owner": "skratch", "cap": "Legend has it that he made par from all of these.", "sec": "shots", "tags": [], "note": "", "ts": 1789924075, "club": []}, {"id": "DdUc0A7sYnq", "url": "https://www.instagram.com/reel/DdUc0A7sYnq/", "owner": "michaelfarriertwist", "cap": "Day 1️⃣9️⃣ of giving you one golf tip every day to help you play better golf, shoot lower scores and enjoy the game more ⛳️\n\nFollow along and let’s see how much we can improve your game, one tip at a time 👌 #golf #golftips #onetipatatime #golfcoach", "sec": "misc", "tags": [], "note": "", "ts": 1789524305, "club": []}, {"id": "DdC3hjEscbf", "url": "https://www.instagram.com/reel/DdC3hjEscbf/", "owner": "golfers_hq._", "cap": "Brilliant tip from a pro golfer on iron striking \nLink in bio for fundamental proven strategies to improve your game \n#golf #viral #fyp #sport #training", "sec": "strike", "tags": ["fat"], "note": "", "ts": 1788922090, "club": ["irons"]}, {"id": "DdJJcQtS_vT", "url": "https://www.instagram.com/reel/DdJJcQtS_vT/", "owner": "togigolf", "cap": "レッスンスケジュールはプロフィール画面トップにピン留め⛳️\nご予約はプロフィール画面のリンクからWebにて承ります！お気軽にご参加下さい♪\n\nストーリーではワンポイントドリル、レッスン会情報等アップしています😀\nその他情報はハイライトをご覧下さいね👍\n-———————————\n●大山トギ\n1983年生まれ。PGAティーチングプロA級・ジュニア指導員\n趣味：旅行✈️\n好物：ビール🍺\n嫌物：虫🐛\n特技：英会話🇬🇧\n\n👕ウェア提供\nJ.Lindeberg Japan\n\n🎥撮影協力\n川越カントリークラブ\n-———————————", "sec": "misc", "tags": [], "note": "", "ts": 1788680621, "club": []}, {"id": "DcJ9bmvyf2A", "url": "https://www.instagram.com/reel/DcJ9bmvyf2A/", "owner": "jparkgolf", "cap": "I call this the worlds greatest drill because I haven’t found a better name for it 😂 #golf", "sec": "misc", "tags": [], "note": "", "ts": 1787988203, "club": []}, {"id": "DbWfKxoSVmD", "url": "https://www.instagram.com/reel/DbWfKxoSVmD/", "owner": "coach_bauman", "cap": "They go together \n•\n•\n•\n#golf #golfswing #golfcoach #golflife #golfer", "sec": "misc", "tags": [], "note": "", "ts": 1787986912, "club": []}, {"id": "DckOVQkNicb", "url": "https://www.instagram.com/reel/DckOVQkNicb/", "owner": "tonyfettogolf", "cap": "🏌️‍♂️ A lot of golfers struggle with their swing without realizing the problem may start with their grip.\n\n⛳️ Holding the club in your palms: The grip should sit more in the fingers instead of deep in the palms. This allows your hands and wrists to move more naturally throughout the swing.\n\n🏌️‍♀️ Gripping too far up the club: If the butt end of the club sits underneath the pad of your lead hand, you may be gripping too high. Leave a small amount of the grip extending beyond your hand for a more secure hold.\n\n🏆 Pointing the V’s toward the lead shoulder: The V’s created by your thumbs and index fingers should generally point toward your trail shoulder. If they point toward the lead shoulder, your grip may be too weak and make controlling the clubface more difficult.\n\n🏌️ Fix your grip before trying to fix your swing.\n\n#GolfTips #GolfGrip #GolfSwing #GolfForBeginners #GolfImprovement", "sec": "setup", "tags": [], "note": "", "ts": 1787913750, "club": []}, {"id": "DbYn7I4EbGh", "url": "https://www.instagram.com/p/DbYn7I4EbGh/", "owner": "breakn80golf", "cap": "Master these 5 shots and you’ll save strokes every round. ⛳️\n\nYou don’t need a perfect swing—you need the right shots at the right time.\n\n✅ Chip & Run\n✅ Pitch Shot\n✅ Bunker Blast\n✅ Lag Putt\n✅ Punch Recovery\n\nIf you can confidently execute these five shots, you’ll avoid big numbers, get up-and-down more often, and start shooting lower scores.\n\nWhich one gives you the most trouble? Let me know in the comments! 👇\n\n📌 Save this post for your next round.\n📤 Share it with your golf buddies.\n🏌️ Follow Break’n 80 Golf Tips for daily golf tips that help you break 80 faster. #golf #golftips #golftipsdaily #golfersofinstagram #break80", "sec": "shots", "tags": [], "note": "", "ts": 1787664978, "club": []}, {"id": "DcW-vMESki3", "url": "https://www.instagram.com/reel/DcW-vMESki3/", "owner": "birdiegum", "cap": "🏌️‍♂️ A lot of golfers don’t realize that the direction your putter is traveling through impact can have a major effect on how the ball begins to roll.\n\n⛳️ For a consistent roll, the putter should be moving slightly upward at impact, contacting the upper portion of the golf ball.\n\n🏌️‍♀️ Catching the ball this way can help reduce skid and get the ball rolling end over end sooner for a more predictable roll.\n\n🏆 You don’t need to exaggerate the upward motion. A small change in the strike can make a meaningful difference in the way the ball rolls.\n\n🏌️‍♂️ Better contact leads to a better roll.\n\n#PuttingTips #GolfTips #Putting #GolfSwing #GolfImprovement", "sec": "putt", "tags": [], "note": "", "ts": 1787566506, "club": []}, {"id": "DcYi78ExMK9", "url": "https://www.instagram.com/reel/DcYi78ExMK9/", "owner": "jgolffitness", "cap": "Comment “Begin” to find the perfect golf fitness plan for your goals. \n•\nWhen you comment I will send you a quick form to fill out. Then I will recommend the best plan for your goals. \n\n#golffitness #golfworkout #golfswing #golf", "sec": "fit", "tags": [], "note": "", "ts": 1787566448, "club": []}, {"id": "DcaEs-5NPAW", "url": "https://www.instagram.com/reel/DcaEs-5NPAW/", "owner": "msimons21", "cap": "Comment BLUEPRINT below and I’ll send you the link to my Iron Blueprint - a comprehensive digital course to get you striking your irons like the pros! 👇\n\nMost amateurs try to rotate everything at once in the downswing. That’s exactly why they lose power before they even reach the ball.\n\nThe downswing lasts less than half a second, and in that window you have to do two completely opposite things in the correct order.\n\n✅ Initiate the backswing with your chest -  the lower body stays quiet until the shoulders have maxed out their turn, then the pelvis helps complete it.\n✅ Resist chest rotation as your arms lower -  this builds the separation that creates real power, not just effort.\n✅ Rip your chest through -  only after that resistance is set does the chest fire, and that sequence is what produces a solid, powerful strike.\n\nSwing as fast as you like. Just never faster than your balance allows.\n\n📩 Send this to your playing partner who swings hard but keeps losing the ball to the right.\n\n#golfwithmags #downswing #golfswing #ballstriking #golfdrills", "sec": "strike", "tags": ["flip"], "note": "", "ts": 1787566428, "club": ["irons"]}, {"id": "DbM7xvDOCoC", "url": "https://www.instagram.com/reel/DbM7xvDOCoC/", "owner": "dannylampe.pga", "cap": "Comment „SLICE“ for my FREE 3-Step video series to turn your Slice into a Draw✅\n\n🫠A lot of people struggle with slicing the ball. They hear about shallowing the club and try to swing the club to one o clock. \n\n☝🏻While this is all great advice, they usually forget about the clubface. If your clubface is way too open, your body won’t allow you to swing more from the inside, because this would simply lead to an even worse right miss.\n\nOnce you know how to set up more draw biased, you can go into working on getting the path more from the inside. This is the exact process I’m using in my free guide.\n\nFollow the simple steps in the video and watch your slice disappear in no time💪🏻\n\n#golfswing #golf #GolfCoach", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1787556290, "club": ["driver"]}, {"id": "DcRp25kvMX6", "url": "https://www.instagram.com/reel/DcRp25kvMX6/", "owner": "evanthompson12", "cap": "Do this if you’re tired of slicing it… \n\nThat boy @jmanziel2 hitting bullet draws and taking all my money at @bountyclubgolf - anyone that knows me knows inner Ev is going crazy right now! \n-\n-\n-\n#golf #golfaddict #golfswing #golfinstruction #golfpro", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1787487386, "club": ["driver"]}, {"id": "DcWZwO9uzSY", "url": "https://www.instagram.com/reel/DcWZwO9uzSY/", "owner": "risingelitegolf", "cap": "⛳ Swinging harder costs you distance.\n\n🔒 The yards are in the angle, not the effort. Hold your wrist hinge longer, release it late, and the speed shows up at the ball instead of halfway down. 💥\n\nThat’s the Lag Train Drill. Same swing, more yards, every club. 💪\n\n👇 Comment “DISTANCE” for the best ball striking drill to gain more yards.\n\n#golf #golfswing #golftips #golfer #redgolf", "sec": "strike", "tags": ["flip"], "note": "Assessed before (Aug): directionally right, but only if the lag comes from the lower body. If it turns into a hands-held angle, park it.", "ts": 1787464785, "club": ["irons"]}, {"id": "DbKOybWItR2", "url": "https://www.instagram.com/reel/DbKOybWItR2/", "owner": "mikebendergolf", "cap": "[ BALL BELOW FEET ] What adjustments should I be making for this lie & how do I execute it?\n.\nFormer PGA Of America National Teacher Of The Year @mikebendergolf explains all the things to consider when faced with this troubling lie \n.\nBENDER GOLF ONLINE: If you find MB’s teaching style to be effective you can access his life’s work at www.bendergolfonline.com or at the link in bio 🔗 \n#Benderized", "sec": "shots", "tags": [], "note": "", "ts": 1787330081, "club": []}, {"id": "DbyMg_4zKlz", "url": "https://www.instagram.com/reel/DbyMg_4zKlz/", "owner": "chacebgolfing", "cap": "Send this to your friend that constantly overthinks their golf swing… 🫣\n\n#swingsimple \n\n#golf #golftips #golfaddict", "sec": "mind", "tags": [], "note": "", "ts": 1787258232, "club": []}, {"id": "DcL_FRsxiC_", "url": "https://www.instagram.com/reel/DcL_FRsxiC_/", "owner": "grooveygolf", "cap": "How to chip \n.\n.\n.\n#golf #chippingtips #golfers #chipping #golftips", "sec": "short", "tags": [], "note": "", "ts": 1787243204, "club": []}, {"id": "DcPI5wJS5Ce", "url": "https://www.instagram.com/reel/DcPI5wJS5Ce/", "owner": "mistertropicana", "cap": "The golf swing made SIMPLE.", "sec": "misc", "tags": [], "note": "", "ts": 1787243078, "club": []}, {"id": "DcOkUAQhHA0", "url": "https://www.instagram.com/reel/DcOkUAQhHA0/", "owner": "theclubbuyer", "cap": "Greg Norman built a Hall of Fame career on one of the most powerful and aggressive swings the game has ever seen. Known as the Great White Shark, he breaks down the key to generating real driver power and where most amateurs leave speed on the table. His insight centers on using the body and the ground rather than trying to muscle the club with the arms and hands. Coming from a two time Open Champion who once dominated the world rankings for years, this is the kind of advice worth grooving on the range. Power has always been about sequence and timing, not brute force. \n\n#golf #gregnorman #golftips #golfswing #cergolf", "sec": "driver", "tags": [], "note": "", "ts": 1787242902, "club": ["driver"]}, {"id": "DcMYCwzualB", "url": "https://www.instagram.com/reel/DcMYCwzualB/", "owner": "thatgolfgrind", "cap": "This move is killing your swing\n\nGet a free swing analysis in my profile!", "sec": "misc", "tags": [], "note": "", "ts": 1787145029, "club": []}, {"id": "DcJmfLeOgDO", "url": "https://www.instagram.com/reel/DcJmfLeOgDO/", "owner": "pro_fitgolf", "cap": "This simple move will make your backswing turn so much easier 👌🏻", "sec": "back", "tags": [], "note": "", "ts": 1787066279, "club": []}, {"id": "DcK6D1yx0-O", "url": "https://www.instagram.com/reel/DcK6D1yx0-O/", "owner": "jess_golfcoach", "cap": "👀⛳️ Struggling with reading greens or curving putts? Try this simple routine: \n\n🤓1. Read the green Go behind the ball and look for the high point of the putt. This helps you understand which way the ball will break.\n🎯 2. Pick your ball line Choose your starting line towards that high point and commit to it.\n⏱️ 3. Feel your pace Practice a few strokes to find the tempo and swing length you need for that distance.\n🏌️‍♀️ 4. Match the lines Line your putter face up with your chosen ball line.\n💭 5. Commit Once you’ve done your work, trust it and make the stroke.\n\nThe goal isn’t to make every putt, it’s to have a simple process you can repeat every time.\n\n#buildingconfidence #beginnergolftips #shelovesgolf #pgaprofessional #sbcgolfcentre", "sec": "putt", "tags": [], "note": "", "ts": 1787065125, "club": []}, {"id": "Da-iCYfDiZs", "url": "https://www.instagram.com/reel/Da-iCYfDiZs/", "owner": "meandmygolf", "cap": "The driver \"hack\" you need! If you struggle with your attack angle check this out and try it out on your next range session!", "sec": "driver", "tags": [], "note": "", "ts": 1787050717, "club": ["driver"]}, {"id": "Dblqjh9OEx_", "url": "https://www.instagram.com/reel/Dblqjh9OEx_/", "owner": "pro_fitgolf", "cap": "ALL GOLFERS DO THIS ⚡️⚡️⚡️", "sec": "misc", "tags": [], "note": "", "ts": 1787042947, "club": []}, {"id": "DcFS4gSNkbE", "url": "https://www.instagram.com/reel/DcFS4gSNkbE/", "owner": "tonyfettogolf", "cap": "⛳ Early extension is one of the most common swing faults among golfers and can create a whole host of consistency problems.\n\n🏌️‍♂️ When your hips move toward the ball through impact, it can change your posture, alter your path, and make solid contact much harder to repeat.\n\n🔧 The good news? There are plenty of simple drills that can help you learn to maintain your posture and create more consistent contact.\n\n🎯 Fix the movement, and you may be surprised how much easier the rest of your swing becomes.\n\n#GolfTips #GolfSwing #EarlyExtension #GolfInstruction #GolfDrills Golfers", "sec": "down", "tags": ["fixed"], "note": "Early extension is a FIXED fault. Only revisit if video shows regression.", "ts": 1787042613, "club": []}, {"id": "DbenFHtAiVO", "url": "https://www.instagram.com/reel/DbenFHtAiVO/", "owner": "meandmygolf", "cap": "If your focus is only on turning in the backswing, it’s easy to sway away from the ball without realizing it. That makes it much harder to return to a solid impact position, often leading to fat or inconsistent strikes. Feeling the lead shoulder move more downward in the backswing helps keep you centered and makes it easier to shift forward for cleaner contact.\nIf consistency or strike quality is something you’re working on, head to the link in our bio. Our coaching plans give you clear guidance on backswing and movement patterns so you can strike the ball more cleanly without guessing.\nComment “Swing” and we’ll send you access to a 2 week FREE trial of Swing Coach, it’s the best way to get real feedback that will help you get better!", "sec": "back", "tags": [], "note": "Sway — not a logged fault for you. Low priority.", "ts": 1786962876, "club": []}, {"id": "Db3XyuYIVBq", "url": "https://www.instagram.com/reel/Db3XyuYIVBq/", "owner": "tylersmithgolf_", "cap": "⛳️It’s time to make the golf swing EASIER, not HARDER. Let me explain!🏌️‍♂️\n\nIn this episode we simply learn the importance of the takeaway and how a poor takeaway can massively impact the rest of your golf swing 👌🏼\n\n#golf #golfswing #golftips", "sec": "back", "tags": ["takeaway"], "note": "", "ts": 1786949458, "club": []}, {"id": "DbvZn10B_M5", "url": "https://www.instagram.com/reel/DbvZn10B_M5/", "owner": "golfkingtv", "cap": "드라이버부터 퍼팅까지\n클럽별 공의 위치를 체크해 보세요.\n\n클럽의 길이와 로프트가 다르기 때문에\n모든 클럽을 같은 위치에 놓고 치면\n일정한 임팩트를 만들기 어렵습니다.\n\n드라이버는 왼쪽에\n우드와 유틸리티는 조금씩 중앙 쪽으로\n아이언은 그보다 더 중앙에 가깝게\n\n칩샷과 퍼팅까지\n각 클럽과 상황에 맞는\n공의 위치를 만들어야 합니다.\n\n공의 위치만 제대로 잡아도\n스윙을 크게 바꾸지 않고\n정타 확률을 높일 수 있습니다.\n\n드라이버부터 퍼팅까지\n내 공의 위치가 맞는지\n이번 영상으로 체크해 보세요.\n\n⸻\n\nCheck your ball position for every club, from the driver all the way to the putter.\n\nBecause each club has a different length and loft, using the same ball position for every shot can make consistent contact difficult.\n\nThe driver is played farther forward, while fairway woods and hybrids move slightly toward the center. Irons are generally played closer to the center.\n\nEven for chip shots and putting, the correct ball position can make a big difference.\n\nSimply adjusting your ball position can improve your chances of solid contact without making major changes to your swing.\n\nCheck your ball position from driver to putter and see if you’re setting up correctly.\n\n#세종골프레슨 #공위치 #정타 #골프스윙 #골프레슨", "sec": "setup", "tags": ["fat"], "note": "", "ts": 1786947972, "club": ["irons", "driver"]}, {"id": "Db_347hAQqj", "url": "https://www.instagram.com/reel/Db_347hAQqj/", "owner": "trainoffcourse", "cap": "If you understand how sequencing works but can't feel it in your swing, you need to train your brain how its done. The brain is the control center of your movement patterns. Unless you give it context as to what you want it to do, it will always revert to familiar patterns, especially when it doesn't have much time to decide (like in your golf swing). This a big part of why its hard to break old swing habits. In order to upgrade your movement, your brain needs lots of slow reps at first to map out the movement pattern. Followed by gradually increasing the speed and challenge so it can learn to maintain and master the new pattern in new situations. Take your time getting these right, slowly add in the speed and then when you have a club in hand, your brain will be able to blend in this ground up sequence without having to think about it. \n\n#golffitness #golfswing #golfperformance #golfmobility #golftraining #golflife #golfer", "sec": "down", "tags": ["heel"], "note": "", "ts": 1786891729, "club": []}, {"id": "Dbybua1OJ8J", "url": "https://www.instagram.com/reel/Dbybua1OJ8J/", "owner": "thatgolfgrind", "cap": "Try a FREE swing analysis in my profile ⛳️", "sec": "misc", "tags": [], "note": "", "ts": 1786869667, "club": []}, {"id": "Db_VRiiGxBr", "url": "https://www.instagram.com/reel/Db_VRiiGxBr/", "owner": "bermangolf", "cap": "Struggling with your driver doesn’t always mean you need a complete swing overhaul. One key movement can help improve how your body transfers power, giving you better contact, more speed, and more distance off the tee.\n\n𝐖𝐡𝐚𝐭’𝐬 𝐜𝐨𝐬𝐭𝐢𝐧𝐠 𝐲𝐨𝐮 𝐦𝐨𝐫𝐞 𝐰𝐢𝐭𝐡 𝐭𝐡𝐞 𝐝𝐫𝐢𝐯𝐞𝐫—𝐝𝐢𝐬𝐭𝐚𝐧𝐜𝐞 𝐨𝐫 𝐜𝐨𝐧𝐬𝐢𝐬𝐭𝐞𝐧𝐜𝐲? 𝐂𝐨𝐦𝐦𝐞𝐧𝐭 𝐘𝐀𝐑𝐃𝐒 𝐚𝐧𝐝 𝐝𝐢𝐬𝐜𝐨𝐯𝐞𝐫 𝐰𝐡𝐚𝐭 𝐲𝐨𝐮𝐫 𝐬𝐰𝐢𝐧𝐠 𝐦𝐚𝐲 𝐛𝐞 𝐦𝐢𝐬𝐬𝐢𝐧𝐠.\n\n#seniorgolf #golftips #drivertips #moredistance #bermangolf", "sec": "driver", "tags": [], "note": "", "ts": 1786833251, "club": ["driver"]}, {"id": "Db_dJiCyzUr", "url": "https://www.instagram.com/reel/Db_dJiCyzUr/", "owner": "ryanmouquegolf", "cap": "Comment the word “PUSH” & I’ll send you 4 downswing drills that you need in order to fix the following issues:\n\n- How to start the downswing\n- Fix your slice\n- Fix your hook\n- Fix early extension\n\nMost golfers “turn the hips” wrong! THIS is how you should do it 👊🏼", "sec": "down", "tags": ["ott"], "note": "", "ts": 1786728786, "club": []}, {"id": "Db3RC_0xy9Z", "url": "https://www.instagram.com/reel/Db3RC_0xy9Z/", "owner": "keithbennettgolf", "cap": "Club Face is King!", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1786480915, "club": ["driver"]}, {"id": "DbgAz6lRo3Q", "url": "https://www.instagram.com/reel/DbgAz6lRo3Q/", "owner": "keithbennettgolf", "cap": "Comment HELP and I’ll send you a link to my new practice guide \n\nSave this for your next practice session", "sec": "mind", "tags": [], "note": "", "ts": 1786225358, "club": []}, {"id": "DbvOZtuNaRZ", "url": "https://www.instagram.com/reel/DbvOZtuNaRZ/", "owner": "golfwithanna", "cap": "Why you should use Tommys stamp drill ⬇️\n\nTommy speaks about how pros use the ground when hitting the ball. This drill helps you hit down on it, keeps your weight on the lead foot and ensures you strike the ball first then ground second. \n\nIf you fat or skull the ball from lifting up, Tommy says this helps you make those consistent strikes 🙌\n\n#golfdrills #tommyfleetwood #golfcoaching #womensgolf #golflesson", "sec": "fat", "tags": ["heel"], "note": "Ball-first, lead-side pressure. Also a good trail-heel rehearsal.", "ts": 1786189215, "club": ["irons"]}, {"id": "DbE12ZgFPjz", "url": "https://www.instagram.com/p/DbE12ZgFPjz/", "owner": "breakn80golf", "cap": "", "sec": "misc", "tags": [], "note": "", "ts": 1786045730, "club": []}, {"id": "DbfyUppz2d9", "url": "https://www.instagram.com/reel/DbfyUppz2d9/", "owner": "theorygolfapp", "cap": "Learn your own green reading process and own it. #golfimprovement #putting #golf #golftips #coursemanagement", "sec": "putt", "tags": [], "note": "", "ts": 1785736693, "club": []}, {"id": "DbTamlqNkPr", "url": "https://www.instagram.com/reel/DbTamlqNkPr/", "owner": "mikes3dlife", "cap": "Does this tip work for you? 🏌️‍♂️ #golf", "sec": "misc", "tags": [], "note": "", "ts": 1785361464, "club": []}, {"id": "Da3blx3Od-t", "url": "https://www.instagram.com/reel/Da3blx3Od-t/", "owner": "thatgolfgrind", "cap": "Pros do this & most amateurs don’t", "sec": "misc", "tags": [], "note": "", "ts": 1784258555, "club": []}, {"id": "Daagup7Neq3", "url": "https://www.instagram.com/reel/Daagup7Neq3/", "owner": "jerome.rufin", "cap": "🔥COMMENT Clubhouse if you want to learn directly from the world’s best golf coaches on the PGA Tour that I train with, and…\n\nGet invited to an exclusive digital golf club where I will be providing premium resources, daily coaching, and more to help you improve.", "sec": "misc", "tags": [], "note": "", "ts": 1783331947, "club": []}, {"id": "DaSqYdttHBr", "url": "https://www.instagram.com/reel/DaSqYdttHBr/", "owner": "chrissteelgolf", "cap": "FULL 1 HOUR PUTTING ROUTINE\n\nCovering all 3 areas of putting - Start line, Green Reading and Speed Control\n\nDo this routine weekly and you’ll see huge gains in your putting performance! #golf", "sec": "putt", "tags": [], "note": "", "ts": 1783180232, "club": []}, {"id": "DZp36uhNBbx", "url": "https://www.instagram.com/reel/DZp36uhNBbx/", "owner": "jgolffitness", "cap": "Do you want to rotate like Rory McIlroy? \n\nComment “Coach” and I will send you a link to apply for my online golf fitness training. \n\nThis is the fastest way to improve your mobility, distance and consistency. \n\n#golfworkout #rotationalexercises #golffitness #golftips", "sec": "fit", "tags": [], "note": "", "ts": 1782758697, "club": []}, {"id": "DTnCiG9D2IO", "url": "https://www.instagram.com/reel/DTnCiG9D2IO/", "owner": "kimminjunpro", "cap": "‼️저장하고 체크해보세요‼️\n\n그립 어떻게 잡고 계신가요?! 꼭 여러번 보고 체크해보세요!!\n\n#golf #골프그립 #golftip #골프기초 #golfgrip", "sec": "setup", "tags": [], "note": "", "ts": 1782648048, "club": []}, {"id": "DY9utwsx8KM", "url": "https://www.instagram.com/reel/DY9utwsx8KM/", "owner": "fryarfitnessgolf", "cap": "🚨 If your backswing feels tight, your follow-through feels forced, and you’re losing distance every year… your rotation is the problem.\n\nMost golfers blame age, flexibility, or swing mechanics when the real issue is simple:\n\n❌ Limited rotation = limited power.\n\nThe more your body can rotate, the easier it is to create speed, stay consistent, and protect your joints from unnecessary stress.\n\nDo this mobility routine 5x per week and you’ll start to:\n\n✅ Increase clubhead speed\n✅ Add effortless distance\n✅ Improve ball striking consistency\n✅ Reduce stiffness and soreness\n✅ Play better golf for years to come\n\nDistance isn’t just about swinging harder. It’s about moving better.\n\n💬 Comment “ROTATE” if you want more distance without feeling like you’re swinging out of your shoes.\n\n#golffitness #golfmobility #golfperformance #golftraining #golfdrills", "sec": "fit", "tags": [], "note": "", "ts": 1782616764, "club": []}, {"id": "DZXwJ0BouEk", "url": "https://www.instagram.com/reel/DZXwJ0BouEk/", "owner": "osteotiaofficial", "cap": "Rhomboid pain relief 💯 \n\n#physicaltherapy #backpain #neckpain #rhomboids #knot", "sec": "body", "tags": [], "note": "", "ts": 1782613287, "club": []}, {"id": "DZgOBnHpeQT", "url": "https://www.instagram.com/reel/DZgOBnHpeQT/", "owner": "golfperformancedoc", "cap": "Tight & weak hips are a distance killer 🙅🏻‍♂️\n\nIf this exercise looks impossible for you, it probably is. And if it is, you’re leaving distance on the table.\n\nComment “Mobility” and I’ll send you my full program to get that distance back 🏌️‍♂️💣\n\n#golf #golfer #GolfFitness #GolfPerformance #GolfMobility", "sec": "fit", "tags": [], "note": "", "ts": 1782592160, "club": []}, {"id": "DYhHBTuvp5o", "url": "https://www.instagram.com/reel/DYhHBTuvp5o/", "owner": "drrodpt", "cap": "If your shoulder and neck hurt\n\n🎥 Video by Dr. Rodion Narkolayev\n🏅 Board Certified Physical Therapist\n💪 Certified Advanced Manual Therapist\n📧 Email: hello@truebodypt.com\n📍 Address:\n65-36 99th Street, Suite #1D\nRego Park, New York 11374\n📞 Phone:\n718-897-6869\n917-886-5667\n\n⚠ Disclaimer: This video is for educational purposes only and does not replace professional medical advice. If you experience pain or have a medical condition, please consult a qualified healthcare professional before trying any exercises or techniques shown.\n\nPhysical therapy Queens, Physical therapy Forest Hills, Physical therapy Rego Park, Physical therapy New York, Physical therapy Dr. Narkolayev, Physical therapist near me, Local physical therapist, Physical therapy, Rodion Narkolayev", "sec": "body", "tags": [], "note": "", "ts": 1782527872, "club": []}, {"id": "DaBmkyykRGx", "url": "https://www.instagram.com/p/DaBmkyykRGx/", "owner": "divotdemon", "cap": "Putting is 40% of the game and I used to spend about 5% of my practice time on it. The math wasn’t mathing.\n\nMost of the strokes you lose on the greens aren’t from having a bad stroke, they’re from habits you don’t even know you have.\n\nHow many of these are you guilty of? Save this and fix them so you can finally have some confidence in your putter.", "sec": "putt", "tags": [], "note": "", "ts": 1782499838, "club": []}, {"id": "DZ-BhoaB1jU", "url": "https://www.instagram.com/reel/DZ-BhoaB1jU/", "owner": "sdavisgolffit", "cap": "I am so happy I threw the camera up during a lesson the other day helping correct a lack of wrist hinge in a golf swing. I see this ALOT. \n\nNot allowing the wrists to work forces, your torso and arms to work significantly harder during your golf swing.\n\nYou can see in the first demonstration that I do in order to get the club up. I am forced to pull out of posture and break my arms.\n\nImmediately after my wrists soften, the Club is able to naturally work up and down with a lot less effort.\n\nIf this is something that you’ve never thought about, I encourage you to give it a try\n\n#golfer #golfing #golfgirl #golftips #golfcoach", "sec": "back", "tags": ["takeaway"], "note": "", "ts": 1782360871, "club": []}, {"id": "DZU2dZ1uuzo", "url": "https://www.instagram.com/reel/DZU2dZ1uuzo/", "owner": "ferdinandhaag", "cap": "If there’s one guy worth listening to when it comes to the golf grip, it’s Ben Hogan.\n\nThe grip is one of the first things you need to get right in golf. If your grip is off, everything else gets harder and you’ll start making compensations in your swing without even realizing it.\n\nGetting your grip right will help you make better contact, hit more consistent shots, and give yourself a better chance to improve.\n\nSo be sure to save this video as your go to for a great grip ⛳️", "sec": "setup", "tags": [], "note": "", "ts": 1782268268, "club": []}, {"id": "DZ6oNWus5Ei", "url": "https://www.instagram.com/reel/DZ6oNWus5Ei/", "owner": "golf_birds_and_i", "cap": "Position 🏌️‍♀️⛳️", "sec": "misc", "tags": [], "note": "", "ts": 1782243747, "club": []}, {"id": "DWv_HzkE0KB", "url": "https://www.instagram.com/reel/DWv_HzkE0KB/", "owner": "golfprowannabes", "cap": "This is really easy to do and gives you the instant feedback you need to get better at not coming over the top! \n.\n#golfdrill #golftip #golfswing", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1782066518, "club": ["driver"]}, {"id": "DZxr8uknN74", "url": "https://www.instagram.com/p/DZxr8uknN74/", "owner": "scratchgolfdad", "cap": "Tension destroys swing tempo faster than any bad swing thought ever could.\n\nWhen you grip too tight, rush your backswing, or force a move, tempo dies. And once tempo’s gone, consistency disappears with it.\n\nIf you want smoother, more consistent contact: Focus on the flow of the swing, not the force.\n\nTempo isn’t about slowing down. It’s about staying calm enough to let your swing happen.\n\nFree your mind… your tempo will follow.\n\n#golftempo #tempotown #golfdrills #golftips #golfadvice", "sec": "mind", "tags": [], "note": "", "ts": 1781979423, "club": []}, {"id": "DYctLC7sDPC", "url": "https://www.instagram.com/reel/DYctLC7sDPC/", "owner": "backninecharge", "cap": "Master your driver swing with these pro tips!  Stop guessing and start hitting pure. Learn proper setup, stance, and tilt for powerful, accurate drives. Your golf game will thank you! #GolfTips #DriverSwing #GolfLife", "sec": "driver", "tags": [], "note": "", "ts": 1781979335, "club": ["driver"]}, {"id": "DZxbsQhswJY", "url": "https://www.instagram.com/reel/DZxbsQhswJY/", "owner": "nilsconwaygolffit", "cap": "Been stuck sitting at a desk all week? 💻⛳\n\nIf you’ve spent most of the week sitting for work, your hips, back, and shoulders are probably feeling a little stiffer than they should.\n\nBefore you head out for golf this weekend, don’t overcomplicate things. Spend a few minutes getting your body moving, improving your mobility, and waking up the muscles you’ll need on the course.\n\nA little bit of movement goes a long way when it comes to helping you move better, swing better, and feel better during your round.\n\nI also have a Mobility & Stretching Class tonight at 5pm in the gym, where we’ll be working on these exact areas to help golfers improve mobility, reduce stiffness, and prepare their bodies for better performance.\n\nDrop me a message if you’d like to join us. ⛳💪\n\n#golf #golfing #golffitness #golfers #golfers", "sec": "body", "tags": [], "note": "", "ts": 1781949419, "club": []}, {"id": "DWKSjWeD2Ji", "url": "https://www.instagram.com/reel/DWKSjWeD2Ji/", "owner": "alexakim19", "cap": "One simple hip turn can completely change the way you strike the ball.\nAt impact, your hips should be slightly open to the target, not square or stuck. This creates space for your arms to come through and helps you compress the ball properly.\n\nIf your hips stall, your hands flip… and that’s when inconsistent contact shows up.\n\nFocus on rotating through, not sliding. Small move, big difference. Hope this video helps! \n\n#golf #golfers #golfswing #golflessons #golftips", "sec": "down", "tags": ["flip", "heel"], "note": "Speaks directly to your stall → flip pattern.", "ts": 1781788263, "club": ["irons"]}, {"id": "DY7q5TLGi4g", "url": "https://www.instagram.com/p/DY7q5TLGi4g/", "owner": "scratchgolfdad", "cap": "Be honest, how much time do you spend training your mind? Most golfers live in the mechanical world with their swing, and then wonder why their swing falls apart under pressure. \n\nWe obsess over positions… but ignore commitment.\n\nWe chase perfect technique… but ignore confidence, trust, and decision-making.\n\nThese 5 golf drills for your mind are designed to do 1 thing. Get you out of control mode and back into trust mode.\n\nSave this for your next round and watch what happens.\n\n#golfmentalgame #golfpsychology #golfmindset #golftips #zengolf", "sec": "mind", "tags": [], "note": "", "ts": 1781787770, "club": []}, {"id": "DZp_dNkEgof", "url": "https://www.instagram.com/reel/DZp_dNkEgof/", "owner": "ethanjonesgolf", "cap": "fix your slice by fixing how you grip the club at set up!", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1781748968, "club": ["driver"]}, {"id": "DZhgsrnTvXl", "url": "https://www.instagram.com/reel/DZhgsrnTvXl/", "owner": "sam.druce", "cap": "WHY YOU’RE EARLY EXTENDING (And How To Fix It) 👇\n\nYour body early extends because it has no other option. Your lower body can’t stabilise, so your hips push toward the ball. Your upper body can’t separate from your lower body, so everything moves together. The result — you stand up through impact and lose your posture.\n\nHere’s how to fix it:\n\nFirst, build hip mobility and internal rotation. If you can’t internally rotate your hips, you have no chance of doing it while maintaining golf posture. This is where most people skip a step.\n\nThen, build lower body stability. Once you have the range of motion, your hips need to learn to rotate without thrusting forward. If your lower body can’t hold its position under load, it will always push toward the ball to find stability somewhere.\n\nThen, train upper body separation. Your upper and lower body need to move independently. If they can’t separate, your body has no choice but to lunge at the ball as one unit.\n\nFinally, put it under speed with a feedback drill. Slow reps build the pattern. But your swing isn’t slow. You need to train the correction at speed with feedback.\n\nSave this so you can:\n\nFix it in the gym. Transfer it to the range. Keep it on the course.\n\n#golf #golffitness", "sec": "fit", "tags": ["fixed"], "note": "Early extension is a FIXED fault — keep for mobility, not as a swing fix.", "ts": 1781662724, "club": []}, {"id": "DZnhoesOMgQ", "url": "https://www.instagram.com/reel/DZnhoesOMgQ/", "owner": "pro_fitgolf", "cap": "Fix the tight muscle that’s killing your golf swing ❌", "sec": "fit", "tags": [], "note": "", "ts": 1781607226, "club": []}, {"id": "DZXyfXfoRxK", "url": "https://www.instagram.com/reel/DZXyfXfoRxK/", "owner": "birdiegum", "cap": "Want to know why your golf swing feels inconsistent? 👀⛳️ It might start before you even take the club back…\n\nWeight distribution at setup is HUGE 🎯\n\nToo much weight in the heels, toes, front foot, or back foot can completely change balance, contact, and swing path 😵‍💫 Your setup influences everything that happens after.\n\nA lot of beginner golfer problems start with poor weight distribution at address.\nChunks, thin shots, slices, topped balls, loss of balance—sometimes it’s not your swing… it’s how you’re setting up to the ball ❌🏌️‍♂️\n\nGet balanced. Get centered. Build the swing from the ground up 🔥⛳️\n\n#GolfTips #GolfSwing #BeginnerGolf #GolfCoach #GolfLife GolfPractice GolfFundamentals", "sec": "setup", "tags": ["fat"], "note": "", "ts": 1781055885, "club": ["irons"]}, {"id": "DZFXthjzAsb", "url": "https://www.instagram.com/p/DZFXthjzAsb/", "owner": "golftrainer.tips", "cap": "Beating balls for an hour with no plan isn't practice. This is. 🎯\n30 minutes. Three blocks. Actual improvement.\nSave this for your next range session 👇\n\n#GolfTips #RangeRoutine #GolfPractice #GolfLife", "sec": "mind", "tags": [], "note": "", "ts": 1781023382, "club": []}, {"id": "DZVgH6tPtwz", "url": "https://www.instagram.com/reel/DZVgH6tPtwz/", "owner": "ajp_golf_", "cap": "If you want to learn how to bomb your driver, you first need to learn how to hit the ball in the center of the club face every time. The SLO-MO DRIVER SWING DRILL is the best way to improve your ability to find the center of the club face! This drill is simple but profound— focus on club face control, width, sweeping up on the ball, swinging smooth at about 25% effort and finishing the swing perfectly balanced.  Follow this pattern of one slow motion, swing, followed by a full effort swing, followed by a slow motion swing, followed by a full effort swing and then continue to repeat. \nAgain, the center of the face is where you’ll find optimal distance and if you do this drill, you’ll be hitting longer drives in no time! \n\nPedal down! Be grateful, be present, and good luck out there, y’all!\n\n#golf\n#golftip\n#golfcourse\n#coach\n#numbers", "sec": "driver", "tags": [], "note": "", "ts": 1781017260, "club": ["driver"]}, {"id": "DZEJvgNp1G3", "url": "https://www.instagram.com/reel/DZEJvgNp1G3/", "owner": "birdiegum", "cap": "Compressing your irons is difficult for most beginners because they try to help the ball into the air instead of striking down on it. ⛳️\n\nA great drill is starting in an impact position and flicking the ball forward as hard as you can. 💥\n\nThis teaches you how to get your hands ahead of the clubhead, create shaft lean, and make ball-first contact. 🎯\n\nLearn the feeling first, then build it into your full swing. 🚀", "sec": "strike", "tags": ["fat", "flip"], "note": "", "ts": 1781016391, "club": ["irons"]}, {"id": "DZVqEgDAe9P", "url": "https://www.instagram.com/reel/DZVqEgDAe9P/", "owner": "michaelalexandergolf", "cap": "This drill combination is epic!\n.\n.\n#golf #golfswing #golfdrills #golftips #golfswingpath", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1780975232, "club": ["driver"]}, {"id": "DZSx8gIspt7", "url": "https://www.instagram.com/reel/DZSx8gIspt7/", "owner": "jerome.rufin", "cap": "Get my FREE Newsletter to INSTANTLY improve your game. Link in bio \n\nExclusive content from my lessons with world’s best coaches. Behind the scenes look into the Scratch to Scratch show. And more!", "sec": "misc", "tags": [], "note": "", "ts": 1780941296, "club": []}, {"id": "DZSfn3RIrv0", "url": "https://www.instagram.com/reel/DZSfn3RIrv0/", "owner": "hac.golf", "cap": "This drill changed everything for me ‼️\n\nI love it for 3 main reasons…\n\n1️⃣ It comes from arguably one of the best drivers of the golf ball so it can be trusted 🏆 \n\n2️⃣ It makes it super easy to create great arm structure every time 👏🏼 \n\n3️⃣ It can be done literally anywhere - whether you’re at home, the first tee or the driving range 🏡\n\nGive this video a save and try it for yourself - guaranteed to support your game no matter what your level is 📈 \n\nDrop a comment if you have tried this before and let me know how you get on 👍🏽 \n\n#golf #golfer #golftips #golfswing #golflife", "sec": "driver", "tags": [], "note": "", "ts": 1780906805, "club": ["driver"]}, {"id": "DZJlIeaoT_v", "url": "https://www.instagram.com/reel/DZJlIeaoT_v/", "owner": "birdiegum", "cap": "Sometimes the biggest swing problems come from the smallest movements. 👀⛳️\n\nSwaying off the ball during the backswing can make it difficult to return to impact consistently, leading to poor contact, loss of power, and inconsistent ball striking. ❌\n\nAnother common mistake is allowing the lead knee to turn too far inward during the backswing. This can throw off your balance, restrict your ability to rotate properly, and create compensations throughout the rest of the swing. 😬\n\nThe hardest part is that these movements feel small and harmless, making them easy to overlook. But fixing the little details can lead to some of the biggest improvements in your game. 🔥⛳️", "sec": "back", "tags": [], "note": "Sway — not a logged fault for you. Low priority.", "ts": 1780863173, "club": []}, {"id": "DY1irUUTodg", "url": "https://www.instagram.com/reel/DY1irUUTodg/", "owner": "ito_golfcoach", "cap": "下りのパットの距離感を見てみてください✅\n\n#golf #golflesson #adidasgolf #epon", "sec": "putt", "tags": [], "note": "", "ts": 1780806470, "club": []}, {"id": "DZQdpSPsk9Z", "url": "https://www.instagram.com/reel/DZQdpSPsk9Z/", "owner": "halfwayhutontour", "cap": "Here are the 10 putting habits I wish i learned earlier \n\n1️⃣ STOP trying to “make” every putt\nGood putters are obsessed with SPEED first.\nGet the pace right and the hole suddenly gets bigger.\n\n2️⃣ Read the putt from LOW side\nYou’ll see slope way better from underneath the hole than above it ••\n\n3️⃣ Practise from 3-6 feet more!\nHoleing short putts change scorecards.\n\n4️⃣ Build ONE consistent pre-putt routine\nSame steps. Same timing. Same focus.\nPressure loves consistency.\n\n5️⃣ Learn what good contact actually feels like\nMost amateurs hit putts off-centre constantly without knowing.\nCentered strike = better roll + distance control \n\n6️⃣Stop decelerating\nThe stroke should flow THROUGH the ball, not die at impact a\n\n7️⃣Aim smaller\nDon’t “aim at the hole.”\nPick a tiny target in front of the ball and roll it over that spot\n\n8️⃣ Remain stable throughout the stroke\nDon’t look up to see your putt! \n\n9️⃣ Practise with pressure\n1 ball.\n6 feet.\nMake 10 in a row.\nYour brain has to learn consequence\n\n🔟 Accept that even pros miss putts\nBad putters get emotional after misses.\nGood putters stay neutral and move on quickly \n\nMaster these habits and your scores drop WITHOUT rebuilding your swing", "sec": "putt", "tags": [], "note": "", "ts": 1780804553, "club": []}, {"id": "DYsZhsviWTU", "url": "https://www.instagram.com/reel/DYsZhsviWTU/", "owner": "fryarfitnessgolf", "cap": "🤯 Top Mobility tips for golfers that’s struggle with pain and mobility in the upper body! \n\nReach your full golf potential with these daily mobility tips and watch your game improve quickly! \n\n🤑 Comment “Pain” if you want to eliminate poor mobility, gain strength and increase effortless power in your golf swing! \n\n#golfmobility #golffitness #golftraining #dailymobility #golfperformance", "sec": "fit", "tags": [], "note": "", "ts": 1780803347, "club": []}, {"id": "DZA8-9Eh_2u", "url": "https://www.instagram.com/reel/DZA8-9Eh_2u/", "owner": "birdiegum", "cap": "Ball position matters more than most golfers realize. ⛳️👀\n\nThe ball needs to move forward or backward in your stance depending on the club you’re using. 📍\n\nLonger clubs are designed to be played farther forward because they have a shallower swing arc, while shorter clubs are played farther back to help create a more downward strike. 🎯\n\nMany beginner golfers use the same ball position for every club and then wonder why their contact is inconsistent. 😬❌\n\nLearning proper ball position can help you hit the center of the club face more often, improve your ball striking, and make each club perform the way it was designed to. 📈🔥\n\nSometimes better golf isn’t about changing your swing, it’s about putting the ball in the right spot. ⛳️✅", "sec": "setup", "tags": ["fat"], "note": "", "ts": 1780375966, "club": []}, {"id": "DZD3bJsKDJf", "url": "https://www.instagram.com/reel/DZD3bJsKDJf/", "owner": "michaelalexandergolf", "cap": "Good iron players are generally struggling with driver, try this setup and takeaway feel for driver if that's you! \n.\n.\n#golf #golfswing #golftips #golfdriver #golfdrills", "sec": "driver", "tags": ["takeaway"], "note": "", "ts": 1780365927, "club": ["irons", "driver"]}, {"id": "DY65Yu5B5hR", "url": "https://www.instagram.com/reel/DY65Yu5B5hR/", "owner": "t3performancegolf", "cap": "Fixing Your Putting Setup!!\n\nLike and Follow for more!!\n\n#golf #golfer #golfswing #golfcoach #golfinstruction", "sec": "putt", "tags": [], "note": "", "ts": 1780131038, "club": []}, {"id": "DYxVMs-uYOJ", "url": "https://www.instagram.com/reel/DYxVMs-uYOJ/", "owner": "pro_fitgolf", "cap": "Simple exercise you can do at home to improve your swing 🏠", "sec": "fit", "tags": [], "note": "", "ts": 1779761542, "club": []}, {"id": "DYu_53Dymoi", "url": "https://www.instagram.com/reel/DYu_53Dymoi/", "owner": "ajp_golf_", "cap": "‼️YOU DON’T NEED A LONG BACK SWING TO BE A GREAT GOLFER!‼️￼\n\nOne of my all-time favorite swing thoughts!\n“Shoulder to your chin, then go!”\nThis quote has had a huge impact on my game and is probably one of the main reasons I eventually developed a really compact golf swing. The truth is, you don’t need an enormous shoulder turn or a backswing that looks like John Daly’s to hit the ball really well. What you actually need is a consistent move that allows you to hit the ball in the center of the club-face as often as possible. When you get a second, you should look up the golf statistic\n“smash factor,” and take a look at the golf swings that have lead that statistic on the PGA tour over the last 10 years. You know what you’re gonna see? A guy named Jason Dufner, and the most money golf swing that exists.\nAside from good music, good food, and cool spots to travel, my other favorite discussion topic is “smash factor.” I’m here for it anytime. But for now try this swing thought, put it in play and watch how a compact and smooth golf swing is more effective than just about anything out there.\n\nPedal down! Be grateful, be present, and good luck out there, y’all!\n\n#golf\n#golftip\n#golfcourse\n#coach\n#numbers", "sec": "back", "tags": [], "note": "", "ts": 1779680845, "club": []}, {"id": "DYt598Kz95o", "url": "https://www.instagram.com/reel/DYt598Kz95o/", "owner": "noahpgapro", "cap": "Most golfers try to change ball flight with their swing…\nYou can change it at SETUP. ⬇️\n\n✔️ Handle HIGH = lower launch\n✔️ Handle LOW = higher launch\n\nSmall setup changes can completely change trajectory and shot shape without rebuilding your swing.\n\nLearn how to match setup to the shot you want to hit. 🔥\n\nAnd keep your grooves clean for more consistent spin and ball flight. @rangebrush Promo Link in Bio! \n\n#golfswing #golftips #golf #golfinstruction #golfcoach", "sec": "shots", "tags": [], "note": "", "ts": 1779679496, "club": []}, {"id": "DYKvFABJQB4", "url": "https://www.instagram.com/reel/DYKvFABJQB4/", "owner": "lennycalisthenics", "cap": "Best stretches for your entire body #flexibility #mobility #longevity #wellness #fitness", "sec": "body", "tags": [], "note": "", "ts": 1779679336, "club": []}, {"id": "DYvMTeKSPPu", "url": "https://www.instagram.com/reel/DYvMTeKSPPu/", "owner": "birdiegum", "cap": "🏌️‍♂️ The crazy thing about golf is that the smallest adjustments often create the biggest changes.\nA tiny setup change, grip tweak, or feel can completely change contact, consistency, and ball flight.\n\n⛳️ Narrowing your stance with irons helps you stay more centered and makes it easier to hit down on the ball properly. That steeper attack angle leads to cleaner contact, better compression, and more consistent strikes 💥\n\n🦶 Flaring your lead foot about 45 degrees opens up your hips and makes it much easier to shift pressure into your lead side during the downswing. Most golfers get stuck because their body physically can’t rotate through the shot.\n\n🧠 “L to L” keeps the swing simple. Instead of 15 swing thoughts at once, you focus on creating an L shape in the backswing and another L shape in the follow through. Simple thoughts usually create better swings.\n\n➡️ Leaning slightly toward the target in the backswing helps prevent hanging back and scooping the ball. It encourages better weight shift, cleaner ball-first contact, and a much more solid strike 🔥", "sec": "fat", "tags": [], "note": "", "ts": 1779678892, "club": ["irons"]}, {"id": "DYpTesAx5FK", "url": "https://www.instagram.com/reel/DYpTesAx5FK/", "owner": "fryarfitnessgolf", "cap": "🔥 Your golf swing isn’t “getting old”…\nyour hips just stopped moving. ⛳️\n\nMost golfers keep buying new clubs when the real problem is they can’t rotate anymore.\n\nTight hips force early extension, loss of posture, weak contact, and that “where did my distance go?” feeling.\n\nFree up your hips.\nFree up your swing.\n\nDo this daily and watch how much easier power starts to feel. 🔥\n\nComment “HIPS” and I’ll send you my golf mobility system.\n\n#golffitness #golfmobility #golfswing #golfperformance #golftips", "sec": "fit", "tags": [], "note": "", "ts": 1779507933, "club": []}, {"id": "DYnZ9GaAVMv", "url": "https://www.instagram.com/reel/DYnZ9GaAVMv/", "owner": "michaelalexandergolf", "cap": "Longer clubs require specific fundamentals for success this will help you! \n.\n.\n#golf #golfswing #golftips #golfer #golfing", "sec": "driver", "tags": [], "note": "", "ts": 1779419664, "club": ["driver"]}, {"id": "DX7B8oLNKDj", "url": "https://www.instagram.com/reel/DX7B8oLNKDj/", "owner": "michaelalexandergolf", "cap": "If you grip it in the palms you have very little chance of controlling the club. Yes I am aware that there are pros who grip more in the palms but they are outliers and a lot more skilled than you... make it easier for yourself! \n.\n.\n#grip #golfgrip #golftips #howtogripgolf #golfswing", "sec": "setup", "tags": [], "note": "", "ts": 1779256367, "club": []}, {"id": "DYhuMiRIKD-", "url": "https://www.instagram.com/reel/DYhuMiRIKD-/", "owner": "tylersmithgolf_", "cap": "Are you a guilty of having far too many swing thoughts?🧠🏌️‍♂️\n\nWell, they are 2 different swings but we want them to feel as similar as possible. If we treat them as 2 completely different swings, how can we expect to consistently switch between the 2 when we are on the course⛳️It doesn’t happen. \n\n#golf #golfswing #golftips", "sec": "mind", "tags": [], "note": "", "ts": 1779243513, "club": []}, {"id": "DYc4XMYMjAs", "url": "https://www.instagram.com/reel/DYc4XMYMjAs/", "owner": "ryangribbengolf", "cap": "Simple idea. Big impact.", "sec": "misc", "tags": [], "note": "", "ts": 1779158841, "club": []}, {"id": "DYddnOVsjt4", "url": "https://www.instagram.com/reel/DYddnOVsjt4/", "owner": "jgolffitness", "cap": "Is your golf swing short? Comment “Golf” for my free 7 day golf fitness plan. This routine includes 3 mobility and 4 strength workouts designed specifically for golf.\n\n(If you already have went through the free plan message me “app” to start a more personalized plan)\n\n#golffitness #golfworkout #golfexercise #golfaddict #golfcoach", "sec": "fit", "tags": [], "note": "", "ts": 1779157897, "club": []}, {"id": "DYfdsftgm9f", "url": "https://www.instagram.com/reel/DYfdsftgm9f/", "owner": "michaelalexandergolf", "cap": "This is the ultimate driver grip to hit bombs - get it out of your palms! \n.\n.\n#golf #golfswing #golfgrip #golfdriver #golftraining", "sec": "setup", "tags": [], "note": "", "ts": 1779157857, "club": ["driver"]}, {"id": "DYc4p8_vSBV", "url": "https://www.instagram.com/reel/DYc4p8_vSBV/", "owner": "tonyfettogolf", "cap": "🚨 Most golfers lose power and consistency because their arms disconnect from their body during the swing ❌🏌️‍♂️\n\nWhen the arms work separately from the chest, the club gets out of position, timing becomes difficult, and slices 🪃, weak contact 👎, and inconsistency show up fast.\n\nThe towel drill 🧻 is one of the best ways to train connection 🔗. By keeping a towel under your arms, you learn how to rotate your body and arms together 🤝, creating a more connected, repeatable swing.\n\n✅ Better sequencing ✅ More solid contact ✅ Straighter ball flight ✅ More effortless power 💥\n\nStay connected, stay consistent 🎯⛳️", "sec": "down", "tags": [], "note": "", "ts": 1779157439, "club": []}, {"id": "DXAL15qhDWg", "url": "https://www.instagram.com/reel/DXAL15qhDWg/", "owner": "freeformgolf", "cap": "Your Ultimate Guide in the Sand 🏖️\n\nFollowing on from a recent post of mine about how to get out of bunkers easily using the line Method… here is a simple guide to help you understand how to approach different lies and shots in the bunker!\n\nSAVE this video as a quick guide reference for your next round or practice session.\n\nGot a buddy who struggles in the sand? Send this over to them and help them simplify the game.\n\nFOLLOW for more simple golf tips like this! ✅\n\n#golftips #golfswing #bunker #sandtrap #shortgame", "sec": "short", "tags": [], "note": "", "ts": 1778992889, "club": []}, {"id": "DYP6ztXCoL5", "url": "https://www.instagram.com/reel/DYP6ztXCoL5/", "owner": "fryarfitnessgolf", "cap": "Use this wall drill to help with your take away! The object is to use the wall to keep your takeaway from getting to round! Feel not Real!!\n\n🚨I’m super exaggerating in this drill and my position at the top is not ideal but it’s a Feel Not Real!!🚨\n \n\n#golftips #golfswing #golfpractice #golffeels #golfdrill", "sec": "back", "tags": ["takeaway"], "note": "Takeaway path checkpoint — complements Ryan's takeaway fix.", "ts": 1778988309, "club": []}, {"id": "DXHvHsxCKGL", "url": "https://www.instagram.com/reel/DXHvHsxCKGL/", "owner": "fistforgegloves", "cap": "Using golf gloves properly can significantly improve your performance:\nPerfect Fit Trick: Choose a glove that fits tightly like a second skin (not loose) to improve grip control.\nGrip Pressure Control: Wear gloves to avoid over-gripping the club—this helps produce smoother swings.\nWeather Adjustment Trick: Use leather gloves for dry conditions and synthetic or hybrid gloves for wet or humid weather.\nRotation Trick: Professional golfers often rotate between multiple gloves to maintain durability and grip quality.\nTraining Trick: Practice swings with gloves to build muscle memory for consistent shots.\n🧤 Types of Golf Gloves Tricks Usage\nLeather Gloves: Best for premium grip and professional play\nSynthetic Gloves: Lightweight, breathable, and good for practice\nRain Gloves: Special grip-enhanced material for wet conditions\nWinter Gloves: Thermal protection for cold weather play\nHalf-Finger Training Gloves: Used for practice and improved hand flexibility\n🧵 Material Used\nCabretta leather (soft & premium grip)\nMicrofiber synthetic fabric (durable & flexible)\nSilicone grip patches (extra control)\nBreathable mesh (for airflow and sweat control)\n🔥 Trending Hashtags\n#GolfGloves #GolfGear #GolfLife #SportsWear #GolfAccessories ProGolf GolfStyle AthleteGear GripControl GolfTraining GolfTips SportsEquipment P", "sec": "setup", "tags": [], "note": "", "ts": 1778988040, "club": []}, {"id": "DWm5QRLkRLh", "url": "https://www.instagram.com/reel/DWm5QRLkRLh/", "owner": "jamesmoorewellness", "cap": "Your upper back will thank you for this 🙏🫶 FOLLOW to be well! \n\n#stretching", "sec": "body", "tags": [], "note": "", "ts": 1778987959, "club": []}, {"id": "DX_wqv6xGuS", "url": "https://www.instagram.com/reel/DX_wqv6xGuS/", "owner": "jgolffitness", "cap": "Comment “Plan” for my free golf fitness routine. This plan includes 7 scheduled workouts (3 mobility & 4 strength). This is the first step to improving your golf fitness.\n\n#golffitness #golfworkout #golfexercise #golfswing", "sec": "fit", "tags": [], "note": "", "ts": 1778903319, "club": []}, {"id": "DYS01wigyd3", "url": "https://www.instagram.com/reel/DYS01wigyd3/", "owner": "michaelalexandergolf", "cap": "Don't lift the arms.. complete the turn! \n.\n.\n#golf #golftips #golfswing #golfing #golfday", "sec": "back", "tags": ["ryan"], "note": "Check against Ryan's cue (lift with the trail hand, lead hand passive). Ryan outranks this reel.", "ts": 1778897991, "club": []}, {"id": "DYM7o_uqu6s", "url": "https://www.instagram.com/reel/DYM7o_uqu6s/", "owner": "michaelalexandergolf", "cap": "Fix your setup to fix your game!\n.\n.\n#golftips #golfswing #golfforbeginners #golflesson #golfcoach", "sec": "setup", "tags": [], "note": "", "ts": 1778872871, "club": []}, {"id": "DYPtSlcob60", "url": "https://www.instagram.com/reel/DYPtSlcob60/", "owner": "nilsconwaygolffit", "cap": "Struggle to separate your upper and lower half?❌\n\nGive these a go✅\n\n15x Reps on each side for each exercise💪🏼\n\nSave to your collection and follow for more🔥\n\n#golf #golfing #fitness #golfstagram #golfers", "sec": "fit", "tags": [], "note": "", "ts": 1778845060, "club": []}, {"id": "DYR3kycgr3F", "url": "https://www.instagram.com/reel/DYR3kycgr3F/", "owner": "jerome.rufin", "cap": "🔥COMMENT Clubhouse if you want to drop your handicap fast, and… \n\nGet invited to an exclusive digital golf club where I will be providing premium resources, daily coaching, and more to help you lower your scores. As well as belong to a community of like minded individuals!", "sec": "misc", "tags": [], "note": "", "ts": 1778844125, "club": []}, {"id": "DYF6uyqxwD-", "url": "https://www.instagram.com/reel/DYF6uyqxwD-/", "owner": "romancruzgolf", "cap": "Keys to a great golf grip ⛳️⤵️\n\n1. Start with a neutral shaft at address. \n\n2. Place the grip in the fingers. This goes for both hands. \n\n3. Careful with wrapping the trail hand under the grip. \n\n#golftips #golflessons #golf", "sec": "setup", "tags": [], "note": "", "ts": 1778334876, "club": []}, {"id": "DX-Ff4zphu7", "url": "https://www.instagram.com/reel/DX-Ff4zphu7/", "owner": "plyogolfpt", "cap": "At 35 years old, I have low back aches from time to time too. \n\nWith a proper warmup, it doesn’t get in the way of playing golf. \n\nAnd it shouldn’t have to for you either. \n\nPick a few of these movements to try before your next round of golf if you’re feeling stiff. \n\nLink in my bio for a free trial to the Golf Longevity System. Subscribers get pre-round warmups assigned each weekend\n\n#golf #golfer #golfwarmup", "sec": "body", "tags": [], "note": "Low-back warm-up — check each move against L5-S1 rules before adopting.", "ts": 1778204376, "club": []}, {"id": "DXpxO7aBcz1", "url": "https://www.instagram.com/reel/DXpxO7aBcz1/", "owner": "shaun.diachkoff", "cap": "Comment the word 15 mins below and I’ll send you over a complete warm up which will help you prepare for your next round or range session 👍\n\n🎥: @mytpi", "sec": "warm", "tags": [], "note": "", "ts": 1778153546, "club": []}, {"id": "DXaMCX-jacJ", "url": "https://www.instagram.com/reel/DXaMCX-jacJ/", "owner": "michaelalexandergolf", "cap": "Have you thought about how the setup will affect your movement in the golf swing?", "sec": "setup", "tags": [], "note": "", "ts": 1778120899, "club": []}, {"id": "DXwqbrTtd2F", "url": "https://www.instagram.com/reel/DXwqbrTtd2F/", "owner": "michaelalexandergolf", "cap": "This takeaway move is so common and if you are doing this you are very likely creating so many other problems in your swing! Of course this is linked to the fundamentals but this is a pattern that shows up over and over again. If you try to adopt this but find it difficult then you must look to your setup for clues! \n.\n.\n#golf #golftips #golfdrills #golfswing #golfer", "sec": "back", "tags": ["takeaway"], "note": "", "ts": 1778120689, "club": []}, {"id": "DV1ginajLub", "url": "https://www.instagram.com/reel/DV1ginajLub/", "owner": "nordborg.golfperformance", "cap": "Feeling stiff before your round? ⛳️\n\nThis quick warm-up can help you move better, activate key muscles and get your body ready to swing.\n\nThis routine takes about 5 minutes and includes mobility, activation and a few explosive movements to wake up the nervous system.\n\nWarm-up:\n\n• Windmills – 1×10\n• Side bends – 1×8/side\n• Forward & backward bends – 1×10\n• World’s greatest stretch – 1×6/side\n• Rotational lunges – 1×6/leg\n• Glute bridges – 1×6\n• Overhead squats – 1×10\n• Single-leg RDL – 1×6/leg\n• Skater jumps – 1×5/leg\n• Squat jumps – 1×5\n\nSave this for your next round.", "sec": "warm", "tags": [], "note": "", "ts": 1778120472, "club": []}, {"id": "DX1oEPHxUgP", "url": "https://www.instagram.com/reel/DX1oEPHxUgP/", "owner": "golfperformancedoc", "cap": "If you’re serious about playing better golf without overhauling your swing, this is for you🏌️‍♂️💣\n\n#Golf #golfer #golfaddict #golffitness #golfperformance", "sec": "fit", "tags": [], "note": "", "ts": 1778120278, "club": []}, {"id": "DUMee8bDzbx", "url": "https://www.instagram.com/reel/DUMee8bDzbx/", "owner": "lifewithjpc", "cap": "HOW TO HINGE THE CLUB\n\nI’ve realised something simple: if you’re starting out and you want the ball to get in the air, learn this early.\n\nGrowing up, I didn’t understand it.\nAnd now that I’m back playing, I’ve realised the fastest way to improve is to go back to basics.\n\nThat’s why I love the preset drill. I makes sure the club is moving the right way from the start, and it teaches your wrists how to move correctly.\n\nLearn to hinge and unhinge… while brushing the turf.\n\nThat’s what Part 2 of this series is: The Hinge.\n\nHere’s what I want you to do:\nHinge the club back to P2, then release it back down and brush the ground where the ball would be.\n\nA funny thing will happen… the ball will go in the air.\n\nOnce it feels comfortable, slowly blend it into a fuller swing.\nAnd the moment you start losing contact, go straight back to the preset drill.\n\nFollow along for more.  #golf #fundamentals #golﬂife #golfimprovement", "sec": "back", "tags": ["takeaway"], "note": "Hinge/preset — fits Ryan's trail-hand lift cue. Good checkpoint.", "ts": 1778120022, "club": []}, {"id": "DX_7ABUKWeX", "url": "https://www.instagram.com/reel/DX_7ABUKWeX/", "owner": "michaelalexandergolf", "cap": "If you're gripping in the palms and still struggling with your golf it is your main problem... not your swing! \n.\n.\n#golfgrip #golfswing #golftips #howtogripgolf #golf", "sec": "setup", "tags": [], "note": "", "ts": 1778119572, "club": []}, {"id": "DYAZG-pgkke", "url": "https://www.instagram.com/reel/DYAZG-pgkke/", "owner": "michaelalexandergolf", "cap": "See the seated posture far too much in players, resulting in very little stability in the lower body! \n.\n.\n#golf #golfswing #golfposture #golftips #golfing", "sec": "setup", "tags": [], "note": "", "ts": 1778090590, "club": []}, {"id": "DXjkpH6jR69", "url": "https://www.instagram.com/reel/DXjkpH6jR69/", "owner": "jgolffitness", "cap": "Comment “Exercise” for information about my “20 Minute Rotational Strength For Golfers”\n•\nThis exercise will improve rotational mobility and strength. If you are a beginner start with a pvc pipe and then work your way up to a light barbell.\n\n#golffitness #golfcoach #golftips #golfstagram", "sec": "fit", "tags": [], "note": "", "ts": 1778044603, "club": []}, {"id": "DVEqcPeD919", "url": "https://www.instagram.com/reel/DVEqcPeD919/", "owner": "drbencollette", "cap": "🚨Stop This🚨\n\nStop stretching your lower back. 🛑\nIt’s not the problem 👇\n\nWhen your upper back doesn’t rotate, your low back is forced to pick up the slack… and that’s where pain starts.\n\nMobilize the thoracic spine.\nLet your swing get rotation from the right place. ✅\n\nComment or Message me “BACK” if you are having back pain that won’t go away\n\n#golf #golffitness #pain #spine #lowbackpain", "sec": "body", "tags": [], "note": "Back-relevant: rotate from the mid-back, not the lumbar. L5-S1 friendly principle.", "ts": 1778043753, "club": []}, {"id": "DXzJPICNRXB", "url": "https://www.instagram.com/reel/DXzJPICNRXB/", "owner": "michaelalexandergolf", "cap": "Struggling with your driver?\n.\n.\n#golf #golftips #driver #slice", "sec": "driver", "tags": ["ott"], "note": "", "ts": 1778041770, "club": ["driver"]}, {"id": "DXxN_0Mgs4H", "url": "https://www.instagram.com/reel/DXxN_0Mgs4H/", "owner": "michaelalexandergolf", "cap": "My greatest drill for consistency especially if you have lost your feel on the swing this will sync everything back up amigo! \n.\n.\n#golf #golfpractice #golfswing #golftips #golfdrills", "sec": "strike", "tags": ["flip"], "note": "", "ts": 1778032104, "club": ["irons"]}, {"id": "DXplzeLgDti", "url": "https://www.instagram.com/reel/DXplzeLgDti/", "owner": "michaelalexandergolf", "cap": "If you get this wrong you are going to struggle no matter what you try to fix your \"swing flaws\"\n.\n.\n#golf #golftips #golfswing #golfer #golfing", "sec": "setup", "tags": [], "note": "", "ts": 1778031438, "club": []}, {"id": "DXwidK1jh1y", "url": "https://www.instagram.com/reel/DXwidK1jh1y/", "owner": "dannymaude", "cap": "Want Pure Iron Strikes? It All Starts With This Setup!\n*\n*\n#swing #ProTips #StraightShots #ConsistencyIsKey #golfcoach #golf #golfhelp #setup #tips #GolfImprovement #pro #driver #GolfLife #lovegolf #slice #SwingSpeed #GolfSecrets #golfclub #golflesson #GolfCoach #GolfAdvice #EasyWins #SwingPower #PowerDrive #SwingFix #DannyMaudeTips #GolfGripMastery #SwingDrill #SwingConsistency #LearnFromMistakes", "sec": "setup", "tags": ["fat"], "note": "", "ts": 1777981898, "club": ["irons"]}, {"id": "DX7skePNtUT", "url": "https://www.instagram.com/reel/DX7skePNtUT/", "owner": "michaelalexandergolf", "cap": "Stop trying to lift the ball into the air.\n.\n.\n#golf #golfswing #golftips #golfer #golfday", "sec": "strike", "tags": ["fat", "flip"], "note": "", "ts": 1777981723, "club": ["irons"]}, {"id": "DX8CAORzYX2", "url": "https://www.instagram.com/reel/DX8CAORzYX2/", "owner": "ito_golfcoach", "cap": "構えのシャフト角度を確認しましょう✅\n\n#golf #golflesson #adidasgolf #epon", "sec": "setup", "tags": [], "note": "", "ts": 1777981398, "club": []}, {"id": "DXeQptZDeBm", "url": "https://www.instagram.com/reel/DXeQptZDeBm/", "owner": "jakereddickgolf", "cap": "This drill will change your understanding of how the pros hit the ball.\n\nEvery action we need to strike the ball consistently in one place.\n\n⛓️ Connection\n🚀 Compression\n🎮 Club Face Control\n📈 Extension\n\nThis is why their power looks so effortless.\n\nIt has given me more control than I ever thought I’d have. Whilst compressing the ball like never before.\n\nI really hope it helps you all❤️ please save this and come back and tell me how you get on!\n\nI must thank @fizzogolf again for the thumb feel. MUST FOLLOW.\nAnd @coach_bauman for inspiring the finish position of this drill. MUST FOLLOW.\n\nI will go further into this. So follow for more.\n\nLet’s tear it up this year team🔥\n\nLove, Jakey x", "sec": "strike", "tags": ["fat", "flip"], "note": "", "ts": 1777981083, "club": ["irons"]}, {"id": "DW02bWXAAX4", "url": "https://www.instagram.com/reel/DW02bWXAAX4/", "owner": "chrisgauntpga_golfcoach", "cap": "“A good golf grip is non-negotiable.” — Padraig Harrington ⛳️\n\n“If you want to play good golf, you must have a good grip.” — Harvey Penick\n\nWe all know the grip matters… but it’s more than just placing your hands on the club.\n\nIt’s the gateway to the brain — driving feel, sensory feedback, and skill development. As explained through Schmidt’s Schema Theory, your grip plays a huge role in how you learn, adapt, and perform.\n\nIt’s not always easy — and it will evolve over time.\nPersevere with it.\n\nBecause a good grip equals good golf 🎯", "sec": "setup", "tags": [], "note": "", "ts": 1777948605, "club": []}, {"id": "DXtJmqUEl_e", "url": "https://www.instagram.com/reel/DXtJmqUEl_e/", "owner": "nexgenjuniorgolfacademy", "cap": "3 types of bunkers lies - hard lie - plugged lie - perfect lie check the video out for demonstration #juniorgolf #uskidsgolf #golfswing #bunker", "sec": "short", "tags": [], "note": "", "ts": 1777830844, "club": []}, {"id": "DWy0NoHCNLL", "url": "https://www.instagram.com/reel/DWy0NoHCNLL/", "owner": "nilsconwaygolffit", "cap": "My 4 non-negotiable daily stretches ⬇️\n1 minute each side.\n\nHalf-kneeling hip flexor stretch\nSide-lying thoracic stretch\nSupine glute stretch\nPigeon pose\n\nI do these every day to keep my hips and thoracic spine moving.\n\nIf you play golf, sit a lot, or train?\n\nTry these👆🏼\n\nIf you only do 4 stretches, make it these🔥\n\nSave to your collection✅\n\n#golf #golfstagram #golfing #fitness #golfcommunity", "sec": "fit", "tags": [], "note": "", "ts": 1777830639, "club": []}, {"id": "DXzmlRTuiMt", "url": "https://www.instagram.com/reel/DXzmlRTuiMt/", "owner": "pro_fitgolf", "cap": "If you’re a golfer over the age of 50, here’s two exercises you absolutely must do! 🔥\n\n#golffitness #golfexercises #golfworkout #fitnessforgolfers #golfswingtips", "sec": "fit", "tags": [], "note": "", "ts": 1777803635, "club": []}, {"id": "DXytyuroTSX", "url": "https://www.instagram.com/reel/DXytyuroTSX/", "owner": "nilsconwaygolffit", "cap": "Save this before your next round ⛳️\n\n4 non-negotiables before you play golf:\n\nMove better. Feel better. Play better.\n\nGive yourself 10 minutes.\nRun through each exercise for the reps shown.\nRepeat for 3 rounds.\n\nFollow for more🔥\n\n#golf #golfers #fitness #golfing #golfstagram", "sec": "warm", "tags": [], "note": "", "ts": 1777729287, "club": []}, {"id": "DXmMhcjjaLi", "url": "https://www.instagram.com/reel/DXmMhcjjaLi/", "owner": "jgolffitness", "cap": "Full body golf warmup you should do before your round.  When warming up your swing you should be focusing on activating your muscles. This means doing a dynamic warmup. The rule is dynamic stretching before your round and static stretching after 👍\n\n#golffitness #golfworkout #golfexercise #golfswing", "sec": "warm", "tags": [], "note": "", "ts": 1777718882, "club": []}, {"id": "DTGDeh3jf2s", "url": "https://www.instagram.com/reel/DTGDeh3jf2s/", "owner": "jgolffitness", "cap": "Comment “PGA” to get access to all of my golf fitness programs. Per your request I have made all of my routines available right on my app. Easily choose which program fits your goals and just follow along. \n•\nIf you want a customized program just send me a message and we can set up a free zoom call. \n\n#golffitness #golfworkout #golfswing #pgatour #golfcoaching", "sec": "fit", "tags": [], "note": "", "ts": 1777223768, "club": []}, {"id": "DXj31LXgvYy", "url": "https://www.instagram.com/reel/DXj31LXgvYy/", "owner": "fryarfitnessgolf", "cap": "Your back pain isn’t from golf… it’s from NOT moving enough.\n\nMost golfers try to “fix” their swing while their body is locked up. That tight thoracic spine + stiff hips? That’s what’s crushing your back every round.\n\nDo this daily mobility work and watch what happens:\n• Less tension in your lower back\n• Smoother rotation through impact\n• Pain-free swings that actually feel effortless\n\nYou don’t need a new swing… you need a body that can move.\n\nSave this before your next round. Your back will thank you.\n\n#golfmobility #golfpain #backpainrelief #golffitness #golfswingfix", "sec": "body", "tags": [], "note": "", "ts": 1777223373, "club": []}, {"id": "DXZMjSxjQ4h", "url": "https://www.instagram.com/reel/DXZMjSxjQ4h/", "owner": "jgolffitness", "cap": "Comment “PGA” for the full plan. \n•\nYou do not need fancy equipment to get in a great workout! You just need to do the right exercises. Try this routine to improve your mobility and strength using just your body weight.\n\n#golffitness #golfworkout #golfexercise #golfswing #golfaddict", "sec": "fit", "tags": [], "note": "", "ts": 1776826311, "club": []}, {"id": "DXF7bB9Cc4E", "url": "https://www.instagram.com/reel/DXF7bB9Cc4E/", "owner": "birdiegum", "cap": "Tired of your putts coming up short… or blowing 6 feet past the hole?\n\nThat’s not bad luck — it’s inconsistent distance control.\n\nThis putting drill trains your backswing length so you know exactly how much power each putt needs.\n\nNo more guessing on the greens.\n\nThen lock in your fundamentals:\nkeep your knees, hips, and head still, and let your shoulders control the stroke — not your hands.\n\nThat’s how you build a repeatable putting stroke and start making
