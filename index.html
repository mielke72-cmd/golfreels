more putts.\n\nIf you want better putting consistency and speed control, this is where it starts.\n\nSave this for your next practice session.\n\n#golf #golftips #putting", "sec": "putt", "tags": [], "note": "", "ts": 1776652036, "club": []}, {"id": "DU9Jy_3kr-A", "url": "https://www.instagram.com/reel/DU9Jy_3kr-A/", "owner": "alexafitt", "cap": "When you sit for too long, there are certain muscles that can become tense and cause severe back pain\nTry to repeat that, and you’ll feel that lightness in your back 🧘‍♀️", "sec": "body", "tags": [], "note": "", "ts": 1776651390, "club": []}, {"id": "DXHkT4miNiX", "url": "https://www.instagram.com/reel/DXHkT4miNiX/", "owner": "sunderlandofscotland", "cap": "Winter golf tips. 1 of 10. \nA little wisdom from the archives… proof that style, imagination and grit never go out of season. And that legends live on, long after the last round.", "sec": "misc", "tags": [], "note": "", "ts": 1776291315, "club": []}, {"id": "DN6HcGaD_U_", "url": "https://www.instagram.com/reel/DN6HcGaD_U_/", "owner": "evanthompson12", "cap": "The #1 drill I keep coming back too…\n\nBeen over a year since discovering this ball striking drill & find myself utilizing it on the range when I’m not hitting it the best. Lots of improvements to be made this fall and will be going to this everyday on the range to keep on getting better! Go try this out & let me know how you do! \n-\n-\n-\n#golf #golfcourse #golfaddict #golfinstruction", "sec": "strike", "tags": ["fat", "flip"], "note": "", "ts": 1767203771, "club": ["irons"]}, {"id": "DO89g4vjYwJ", "url": "https://www.instagram.com/reel/DO89g4vjYwJ/", "owner": "mistertropicana", "cap": "How to start the downswing. \n\n#jimmytropicana #golf", "sec": "down", "tags": ["heel"], "note": "", "ts": 1758868711, "club": []}, {"id": "DA1On4MSUP5", "url": "https://www.instagram.com/reel/DA1On4MSUP5/", "owner": "movementbydavid", "cap": "Hamstring flexibility hack! \n\nOkay well it’s not really a hack, it’s an actual workout that WILL give results. \n\n1. Elephant walks for 30 reps. \n2. Single leg RDL for 10 reps. \n3. Single leg hamstring stretch 30 seconds. \n\nWere your results just as good?? Check both of our bios for resources on how we stay fit! #stayflexy", "sec": "body", "tags": [], "note": "Single-leg RDLs: keep spine neutral, no lumbar rounding/extension under load.", "ts": 1733208012, "club": []}, {"id": "DCZ5cmhRCPK", "url": "https://www.instagram.com/reel/DCZ5cmhRCPK/", "owner": "trainwithalvin", "cap": "Piriformis can wreak havoc on your lower back. \n\nThe piriformis is a small but powerful muscle that stabilizes your hip and helps with movement. \n\nWhen it’s tight or overactive, it can compress the sciatic nerve or create imbalances in your pelvis, leading to unnecessary stress on your lower back.\n\nBut tight piriformis are only part of the puzzle. \n\nThe root cause for your lower back problem often lies in poor posture, imbalanced muscle activation, and other improper movement patterns that overload the spine. \n\nI am currently offering a free 7 day trial to help you release your tight piriformis and fix lower back for good. \n\nComment “Align” below to get started! \n\n#piriformissyndrome #lowbackpainrelief #lowbackpain #lowbackexercises #hippainrelief", "sec": "body", "tags": [], "note": "", "ts": 1732554808, "club": []}, {"id": "DCc1CBUxIbB", "url": "https://www.instagram.com/reel/DCc1CBUxIbB/", "owner": "jamesmoorewellness", "cap": "RELIEVE SCIATICA with a BROOMSTICK\nThis puts the hips into internal and external rotation for a stretch which can help relax the glutes/ hips/ piriformis muscle! This helps take pressure off the sciatic never which helps relieve SCIATICA! FOLLOW TO RELAX YOUR BODY!\n\n#trending #viral\n\nThis is not medical advice", "sec": "body", "tags": [], "note": "", "ts": 1732553249, "club": []}, {"id": "C3QdR9HJr77", "url": "https://www.instagram.com/reel/C3QdR9HJr77/", "owner": "kerrymahergolf", "cap": "🔥 Time to throw it back! ⛳️ Countless golf geeks have discovered me through the legendary Toilet Paper Roll Video! Forever grateful for its impact! Drop a comment below if this gem introduced you to my world! \n\nAre you pumped for my Golf Classes? Don’t miss out! Say « CLASS » or head to kerrymaher.com to join the excitement! 🏌️‍♂️\n\nGet ready for an epic experience in my class! Here’s what awaits you:\n1️⃣ Choose your adventure: Level 1 at 8 AM or 11 AM, or Level 2 at 9 AM.\n2️⃣ Immerse yourself in dynamic sessions every Monday, Wednesday, and Friday.\n3️⃣ Embark on an exhilarating 22-class journey, each session lasting 20 minutes, from Feb 26 to April 10.\n4️⃣ Elevate your skills with insights from guest experts like @plumcoach and @stellankenke.\n5️⃣ Receive a personalized video analysis of your golf swing directly from me! \n\nLet’s make waves together!\n\n#ThrowbackThursday #GolfJourney #Excited #ToiletPaperRollVideo #GolfClasses #LevelUp #DynamicSessions #ExpertInsights #PersonalizedAnalysis #JoinTheAction #GolfLife #GolfersCommunity #GetReadyToSwing #SignUpNow #ElevateYourGame #LegendaryMoment #GolfGoals #CantWait #GameChanger #Pumped #ReadyToLearn", "sec": "misc", "tags": [], "note": "", "ts": 1711902927, "club": []}];
const SECS=[
 ['fat','Fat & Thin','<b>Low point control.</b> Fat and thin are one fault: the bottom of the arc sits behind the ball. Reels here cover ball-first contact, lead-side pressure, ball position and narrower stance. Your iron low point was confirmed controlled in August, so use these as maintenance and for days the strike goes, not as a new rebuild.'],
 ['strike','Iron Strike & Compression','<b>Your #1 iron priority:</b> shaft lean and compression (the flip). Prefer reels where the lower body drives the strike; be wary of anything that has the hands hold or throw the angle.'],
 ['driver','Driver & Slice','Over-the-top path, open face, attack angle. Your right miss is the scorecard truth to test these against.'],
 ['setup','Grip & Setup','Grip, posture, ball position, weight distribution.'],
 ['back','Takeaway & Backswing','<b>Ryan\'s cue rules here:</b> lift with the trail hand, lead hand passive. Anything that contradicts it gets parked.'],
 ['down','Downswing & Sequencing','Transition, hip rotation, trail heel release, connection.'],
 ['short','Short Game & Bunkers','Chipping, pitching, sand.'],
 ['shots','Lies & Shot-making','Uneven lies, trajectory control, scoring shots.'],
 ['putt','Putting','Start line, green reading, speed control.'],
 ['mind','Mental Game & Practice','Tempo, tension, swing thoughts and how to structure range time.'],
 ['warm','Warm-ups','Pre-round and pre-range routines.'],
 ['fit','Golf Fitness & Mobility','Rotation, hips, separation. <b>L5-S1 rule:</b> no loaded lumbar extension — check every exercise before adopting.'],
 ['body','Back & Body Care','Back, neck, hip and hamstring relief. Same L5-S1 rule applies.'],
 ['misc','Swing Thoughts & General','Captions too vague to sort. Open them, then add a note so you know what\'s inside.']
];
const FOCUS=[['fat','Fat & Thin'],['flip','Flip / compression'],['heel','Trail heel / pivot'],['ott','Over-the-top'],['takeaway','Takeaway (Ryan)'],['fixed','Already-fixed faults']];
const TAGN={fat:'fat & thin',flip:'flip',heel:'trail heel',ott:'over-the-top',takeaway:'takeaway',fixed:'fixed fault',ryan:'check vs Ryan'};
const STATUS=[['all','All'],['new','New'],['try','Try next'],['keep','Keep'],['ignore','Ignore']];
const PREVIEW=/github\.io$|localhost|127\.0\.0\.1/.test(location.hostname);
let st={},notes={};try{st=JSON.parse(localStorage.getItem('rtl:st')||'{}');notes=JSON.parse(localStorage.getItem('rtl:notes')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('rtl:st',JSON.stringify(st));localStorage.setItem('rtl:notes',JSON.stringify(notes))}catch(e){}};
let cur={sec:'fat',focus:null,status:'all',club:'all',q:''};
const CLUBS=[['all','All clubs'],['irons','🏌️ Irons'],['driver','🚀 Driver']];
const clubOk=r=>cur.club==='all'||r.club.includes(cur.club);
const inSec=(r,s)=>s==='all'||r.sec===s||(s==='fat'&&r.tags.includes('fat'));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(){
 const f=document.getElementById('focus');f.innerHTML='';
 FOCUS.forEach(([k,n])=>{const c=REELS.filter(r=>r.tags.includes(k)&&clubOk(r)).length;const b=el('button','chip f'+(cur.focus===k?' on':''),`${n}<small>${c}</small>`);b.onclick=()=>{cur.focus=cur.focus===k?null:k;if(cur.focus)cur.sec='all';render()};f.appendChild(b)});
 const s=document.getElementById('secs');s.innerHTML='';
 [['all','All golf']].concat(SECS).forEach(([k,n])=>{const c=REELS.filter(r=>inSec(r,k)&&clubOk(r)).length;const b=el('button','chip'+(cur.sec===k&&!cur.focus?' on':''),`${n}<small>${c}</small>`);b.onclick=()=>{cur.sec=k;cur.focus=null;render();scrollTo(0,0)};s.appendChild(b)});
 const cl=document.getElementById('clubs');cl.innerHTML='';
 CLUBS.forEach(([k,n])=>{const c=k==='all'?REELS.length:REELS.filter(r=>r.club.includes(k)).length;const b=el('button','chip c'+(cur.club===k?' on':''),`${n}<small>${c}</small>`);b.onclick=()=>{cur.club=k;render()};cl.appendChild(b)});
 const t=document.getElementById('stat');t.innerHTML='';
 STATUS.forEach(([k,n])=>{const c=k==='all'?REELS.length:REELS.filter(r=>(st[r.id]||'new')===k).length;const b=el('button','chip'+(cur.status===k?' on':''),`${n}<small>${c}</small>`);b.onclick=()=>{cur.status=k;render()};t.appendChild(b)});
}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function render(){
 chips();
 const kept=REELS.filter(r=>st[r.id]==='keep').length,tried=REELS.filter(r=>st[r.id]&&st[r.id]!=='new').length;
 document.getElementById('sub').textContent=`${REELS.length} golf reels from your saved collection · ${tried} reviewed · ${kept} kept`;
 const intro=document.getElementById('intro');
 if(cur.focus){intro.innerHTML=`<div class="intro">Filtered by focus: <b>${FOCUS.find(f=>f[0]===cur.focus)[1]}</b>. Instagram tips never outrank Ryan or your own footage — max two swing thoughts on the range.</div>`}
 else if(cur.sec==='all'){intro.innerHTML='<div class="intro">Every golf reel you saved, newest first. Mark each <b>Try next</b>, <b>Keep</b> or <b>Ignore</b> after you\'ve watched it. Rule of the house: Instagram tips never outrank Ryan or your own footage.</div>'}
 else{const s=SECS.find(x=>x[0]===cur.sec);intro.innerHTML=`<div class="intro">${s[2]}</div>`}
 if(cur.club!=='all')intro.innerHTML+=`<div class="intro" style="border-left-color:var(--blue)">Showing <b>${cur.club}</b>-specific reels only. General swing reels (grip, sequencing, takeaway) apply to every club — switch to <b>All clubs</b> to see them.</div>`;
 const q=cur.q.toLowerCase();
 const rs=REELS.filter(r=>clubOk(r)&&(cur.focus?r.tags.includes(cur.focus):inSec(r,cur.sec))&&(cur.status==='all'||(st[r.id]||'new')===cur.status)&&(!q||r.cap.toLowerCase().includes(q)||r.owner.toLowerCase().includes(q)||(notes[r.id]||'').toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts);
 const L=document.getElementById('list');L.innerHTML='';
 if(!rs.length){L.innerHTML='<div class="empty-state">Nothing here with these filters.</div>';return}
 rs.forEach(r=>{
  const s=st[r.id]||'new',sn=(SECS.find(x=>x[0]===r.sec)||[])[1];
  const c=el('div','card st-'+s);
  c.innerHTML=`<div class="top"><span class="own">@${esc(r.owner)}</span><span class="sec">${sn}</span></div>
   <div class="cap${r.cap?'':' empty'}">${r.cap?esc(r.cap):'No caption — open to see what it is'}</div>
   ${r.note?`<div class="note">🎯 ${esc(r.note)}</div>`:''}
   ${(r.tags.length||r.club.length)?`<div class="tags">${r.club.map(k=>`<span class="tag club">${k}</span>`).join('')}${r.tags.map(t=>`<span class="tag ${t}">${TAGN[t]||t}</span>`).join('')}</div>`:''}
   <div class="act"><a class="open" href="${r.url}" target="_blank" rel="noopener">▶ Open reel</a>${PREVIEW?'<button class="btn pv">Preview</button>':''}
   <div class="seg">${['try','keep','ignore'].map(k=>`<button data-s="${k}" class="${s===k?'on':''}">${{try:'Try',keep:'Keep',ignore:'Ignore'}[k]}</button>`).join('')}</div></div>
   <textarea placeholder="My note (what the drill is, did it work…)">${esc(notes[r.id]||'')}</textarea>`;
  c.querySelector('.cap').onclick=e=>e.target.classList.toggle('open');
  c.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.s;st[r.id]=st[r.id]===k?'new':k;save();render()});
  c.querySelector('textarea').onchange=e=>{notes[r.id]=e.target.value;save()};
  const pv=c.querySelector('.pv');if(pv)pv.onclick=()=>{const f=c.querySelector('iframe');if(f){f.remove();pv.textContent='Preview'}else{const i=document.createElement('iframe');i.src=`https://www.instagram.com/reel/${r.id}/embed`;i.loading='lazy';c.appendChild(i);pv.textContent='Hide'}};
  L.appendChild(c)});
}
document.getElementById('q').oninput=e=>{cur.q=e.target.value;render()};
render();
</script></body></html>
